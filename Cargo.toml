[package]
name = "screen-mirror"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sender"
path = "src/bin/sender.rs"

[[bin]]
name = "receiver"
path = "src/bin/receiver.rs"

[dependencies]
winit = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
anyhow = "1"
tokio = { version = "1", features = ["rt", "net", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSData"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLCommandQueue", "MTLCommandBuffer", "MTLRenderCommandEncoder", "MTLRenderPipeline", "MTLLibrary", "MTLCommandEncoder", "MTLDrawable", "MTLBlitCommandEncoder", "MTLAllocation", "MTLResource", "MTLTypes", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
core-media = "0.7"
core-video = "0.5"
